# Tests of the Android app on every push. The signed release is built and uploaded by hand: the
# signing key stays off GitHub.
name: Android

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  jvm:
    name: Unit tests and a debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Learning rules, progress file, lock screen settings
        working-directory: app
        run: ./gradlew testDebugUnitTest assembleDebug
      - name: Keep the test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-unit-test-report
          path: app/app/build/reports/tests/testDebugUnitTest
          retention-days: 7
      - name: Keep the debug APK
        uses: actions/upload-artifact@v4
        with:
          name: reci-debug-apk
          path: app/app/build/outputs/apk/debug/*.apk
          retention-days: 30

  emulator:
    name: UI tests on an emulator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      # The emulator needs hardware acceleration, which the runner gives only after this.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          working-directory: app
          script: ./gradlew connectedDebugAndroidTest
      - name: Keep the test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-ui-test-report
          path: app/app/build/reports/androidTests/connected
          retention-days: 7
