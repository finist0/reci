# Tests of the Android app on every push. The signed release is built and uploaded by hand: the
# signing key stays off GitHub.
name: Android

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  jvm:
    name: Unit tests and a debug APK
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - name: Learning rules, progress file, lock screen settings
        working-directory: app
        run: ./gradlew testDebugUnitTest assembleDebug
      - name: Keep the test report
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: android-unit-test-report
          path: app/app/build/reports/tests/testDebugUnitTest
          retention-days: 7
      - name: Keep the debug APK
        uses: actions/upload-artifact@v6
        with:
          name: reci-debug-apk
          path: app/app/build/outputs/apk/debug/*.apk
          retention-days: 30

  emulator:
    name: UI tests on Android ${{ matrix.android }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          # The oldest Android the app supports, on a smaller screen.
          - android: 9
            api: 28
            device: pixel_3a
          # Notifications became a runtime permission here.
          - android: 13
            api: 33
            device: pixel_6
          - android: 15
            api: 35
            device: pixel_6
          # The Android the app is built for.
          - android: 17
            api: "37.0"
            device: pixel_6
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      # The emulator needs hardware acceleration, which the runner gives only after this.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: UI tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: ${{ matrix.device }}
          working-directory: app
          script: ./gradlew connectedDebugAndroidTest
      - name: Keep the test report
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: android-ui-test-report-${{ matrix.android }}
          path: app/app/build/reports/androidTests/connected
          retention-days: 7
