# Tests of the Android app on every push. The signed release is built and uploaded by hand: the
# signing key stays off GitHub.
name: Android

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  jvm:
    name: Unit tests and a debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Learning rules, progress file, lock screen settings
        working-directory: app
        run: ./gradlew testDebugUnitTest assembleDebug
      - name: Keep the test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-unit-test-report
          path: app/app/build/reports/tests/testDebugUnitTest
          retention-days: 7
      - name: Keep the debug APK
        uses: actions/upload-artifact@v4
        with:
          name: reci-debug-apk
          path: app/app/build/outputs/apk/debug/*.apk
          retention-days: 30

  emulator:
    name: UI tests on Android ${{ matrix.android }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          # The oldest Android the app supports, on a smaller screen.
          - android: 9
            image: android-28
            device: pixel_3a
          # Notifications became a runtime permission here.
          - android: 13
            image: android-33
            device: pixel_6
          - android: 15
            image: android-35
            device: pixel_6
          # The Android the app is built for.
          - android: 17
            image: android-37.0
            device: pixel_6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      # The emulator needs hardware acceleration, which the runner gives only after this.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Start an emulator
        run: |
          SDK="$ANDROID_HOME"
          IMG="system-images;${{ matrix.image }};google_apis;x86_64"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --install "$IMG" emulator platform-tools > /dev/null
          echo no | "$SDK/cmdline-tools/latest/bin/avdmanager" create avd -n test -k "$IMG" -d ${{ matrix.device }}
          "$SDK/emulator/emulator" -avd test -no-window -no-audio -no-boot-anim -no-snapshot \
            -gpu swiftshader_indirect > emulator.log 2>&1 &
          "$SDK/platform-tools/adb" wait-for-device
          until [ "$("$SDK/platform-tools/adb" shell getprop sys.boot_completed | tr -d '\r')" = 1 ]; do sleep 5; done
      - name: UI tests
        working-directory: app
        run: ./gradlew connectedDebugAndroidTest
      - name: Keep the test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-ui-test-report-${{ matrix.android }}
          path: |
            app/app/build/reports/androidTests/connected
            emulator.log
          retention-days: 7
