# The iPhone app needs a Mac to build; GitHub's macOS runners provide one with Xcode and the
# iOS simulator. The learning logic also runs on Linux, which is quicker and cheaper. macOS
# minutes are dear, so it runs for every release tag and by hand from the Actions tab.
name: iOS

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      upload:
        description: Upload the build to App Store Connect
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  core-linux:
    name: Learning logic on Linux
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container: swift:6.1
    steps:
      - uses: actions/checkout@v5
      - run: swift test
        working-directory: ios/ReciCore

  app-simulator:
    name: App and UI tests on ${{ matrix.device }}, iOS ${{ matrix.os }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    # GitHub may not offer the newest macOS image to every account yet.
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            device: iPhone 16
            slug: iphone-16
            os: "18.6"
            experimental: false
            main: true
          - runner: macos-15
            device: iPhone SE (3rd generation)
            slug: iphone-se
            os: "18.6"
            experimental: false
            main: false
          - runner: macos-26
            device: iPhone 17 Pro
            slug: iphone-17-pro
            os: latest
            experimental: true
            main: false
          # The largest iPhone and the iPad give the screenshots the App Store asks for.
          - runner: macos-26
            device: iPhone 17 Pro Max
            slug: iphone-17-pro-max
            os: latest
            experimental: true
            main: false
          # The iPad layout; its UI tests are not required to pass yet.
          - runner: macos-15
            device: iPad Pro 13-inch (M4)
            slug: ipad-pro-13
            os: "18.6"
            experimental: true
            main: false
    steps:
      - uses: actions/checkout@v5
      - run: brew install xcodegen
      - run: xcodegen
        working-directory: ios
      - name: Learning logic on macOS
        if: matrix.main
        run: swift test
        working-directory: ios/ReciCore
      - name: Build an unsigned .ipa for a phone
        if: matrix.main
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild build -project Reci.xcodeproj -scheme Reci -configuration Release \
            -sdk iphoneos -destination "generic/platform=iOS" -derivedDataPath build/device \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
          mkdir -p build/ipa/Payload
          cp -R build/device/Build/Products/Release-iphoneos/Reci.app build/ipa/Payload/
          (cd build/ipa && zip -qry ../Reci-unsigned.ipa Payload)
      - name: Keep the .ipa
        if: matrix.main
        uses: actions/upload-artifact@v6
        with:
          name: reci-unsigned-ipa
          path: ios/build/Reci-unsigned.ipa
      # Some runners start without simulators: actions/runner-images#12948.
      - name: Create the simulator if the runner has none
        env:
          NAME: ${{ matrix.device }}
          OS: ${{ matrix.os }}
        run: |
          RUNTIME=$(xcrun simctl list runtimes available -j | jq -r --arg v "$OS" \
            '[.runtimes[] | select(.platform == "iOS" and ($v == "latest" or .version == $v))] | last | .identifier // empty')
          if [ -z "$RUNTIME" ]; then
            xcrun simctl list runtimes
            echo "No iOS $OS runtime on this runner"
            exit 1
          fi
          if xcrun simctl list devices available -j |
              jq -e --arg r "$RUNTIME" --arg n "$NAME" '.devices[$r] // [] | any(.name == $n)' > /dev/null; then
            exit 0
          fi
          TYPE=$(xcrun simctl list devicetypes -j | jq -r --arg n "$NAME" '.devicetypes[] | select(.name == $n) | .identifier')
          xcrun simctl create "$NAME" "$TYPE" "$RUNTIME"
      - name: Build the app with its widgets and run the UI tests
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild test -project Reci.xcodeproj -scheme Reci \
            -destination "platform=iOS Simulator,name=${{ matrix.device }},OS=${{ matrix.os }}" \
            -resultBundlePath build/Reci.xcresult \
            CODE_SIGNING_ALLOWED=NO
      # The screens ScreenshotUITests took, as PNG files named after the shots.
      - name: Export the screenshots
        if: always()
        continue-on-error: true
        working-directory: ios
        run: |
          [ -d build/Reci.xcresult ] || exit 0
          xcrun xcresulttool export attachments --path build/Reci.xcresult --output-path build/shots
          cd build/shots
          jq -r '.[].attachments[] | [.exportedFileName, .suggestedHumanReadableName] | @tsv' manifest.json |
            while IFS=$'\t' read -r file name; do mv "$file" "$(echo "$name" | sed -E 's/_[0-9]+_[0-9A-Fa-f-]+\.png$/.png/')"; done
      - name: Keep the screenshots
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ios-screenshots-${{ matrix.slug }}
          path: ios/build/shots/*.png
          if-no-files-found: ignore
      - name: Keep the test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ios-test-results-${{ matrix.slug }}
          path: ios/build/Reci.xcresult
          if-no-files-found: ignore

  # A pushed release tag, or a run started by hand with "upload" ticked, sends a build to
  # App Store Connect once the tests are green:
  # TestFlight gives it to testers, and the App Store takes it once it is chosen for a release
  # there. The key of the App Store Connect API in the secrets ASC_KEY_P8, ASC_KEY_ID and
  # ASC_ISSUER_ID uploads it. It is signed with the Apple Distribution certificate in
  # ASC_DIST_P12 (base64, password in ASC_DIST_P12_PASSWORD) and the App Store profiles in
  # ASC_PROFILE_APP and ASC_PROFILE_WIDGET (base64); all of them expire after a year. Without
  # the key nothing is uploaded.
  upload:
    name: Upload to App Store Connect
    needs: [core-linux, app-simulator]
    if: >-
      github.repository == 'finist0/reci' &&
      (github.event_name == 'push' || inputs.upload)
    # App Store Connect takes only builds made with the newest Xcode.
    runs-on: macos-26
    timeout-minutes: 60
    # The key reaches only the steps that need it, not Homebrew and XcodeGen.
    steps:
      - name: Look for the App Store Connect key
        id: key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          if [ -n "$ASC_KEY_P8" ] && [ -n "$ASC_KEY_ID" ] && [ -n "$ASC_ISSUER_ID" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::No App Store Connect key in the secrets, nothing is uploaded"
          fi
      # One request to App Store Connect with the key: a wrong secret shows here, plainly, and
      # not as a signing error deep in xcodebuild.
      - name: Check the key with App Store Connect
        if: steps.key.outputs.ok
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        shell: ruby {0}
        run: |
          require "base64"
          require "json"
          require "net/http"
          require "openssl"
          id, issuer = ENV["ASC_KEY_ID"], ENV["ASC_ISSUER_ID"]
          puts "Key ID: #{id.length} characters, Issuer ID: #{issuer.length} characters (10 and 36 expected)"
          key = OpenSSL::PKey.read(ENV["ASC_KEY_P8"])
          b64 = ->(s) { Base64.urlsafe_encode64(s, padding: false) }
          now = Time.now.to_i
          data = [{ alg: "ES256", kid: id, typ: "JWT" },
                  { iss: issuer, iat: now, exp: now + 600, aud: "appstoreconnect-v1" }].map { |h| b64.(h.to_json) }.join(".")
          # JWT wants the two halves of the signature as they are, not in DER.
          sig = OpenSSL::ASN1.decode(key.sign("SHA256", data)).value.map { |n| n.value.to_s(2).rjust(32, "\0") }.join
          res = Net::HTTP.get_response(URI("https://api.appstoreconnect.apple.com/v1/apps?filter[bundleId]=rs.finist.reci"),
                                       "Authorization" => "Bearer #{data}.#{b64.(sig)}")
          puts "App Store Connect answers #{res.code}"
          exit 0 if res.code == "200"
          puts res.body[0, 500]
          exit 1
      - uses: actions/checkout@v5
        if: steps.key.outputs.ok
        with:
          persist-credentials: false
      - if: steps.key.outputs.ok
        run: brew install xcodegen
      - if: steps.key.outputs.ok
        run: xcodegen
        working-directory: ios
      # The number of the run is the build number: it grows with every upload, as App Store
      # Connect wants, while the version stays the one in project.yml.
      # The archive is signed ad hoc and the export signs it with the certificate and the
      # profiles from the secrets: with an API key Xcode fails to make profiles itself
      # ("Authentication failed").
      - name: Archive and sign for the App Store
        if: steps.key.outputs.ok
        working-directory: ios
        env:
          BUILD: ${{ github.run_number }}
          ASC_DIST_P12: ${{ secrets.ASC_DIST_P12 }}
          ASC_DIST_P12_PASSWORD: ${{ secrets.ASC_DIST_P12_PASSWORD }}
          ASC_PROFILE_APP: ${{ secrets.ASC_PROFILE_APP }}
          ASC_PROFILE_WIDGET: ${{ secrets.ASC_PROFILE_WIDGET }}
        run: |
          set -o pipefail
          if [ -z "$ASC_DIST_P12" ] || [ -z "$ASC_PROFILE_APP" ] || [ -z "$ASC_PROFILE_WIDGET" ]; then
            echo "::error::No signing certificate or profiles in the secrets"
            exit 1
          fi
          KC="$RUNNER_TEMP/signing.keychain-db"
          P12="$RUNNER_TEMP/dist.p12"
          KCPASS=$(openssl rand -hex 16)
          trap 'security delete-keychain "$KC" 2>/dev/null; rm -f "$P12"' EXIT
          (umask 077 && printf '%s' "$ASC_DIST_P12" | base64 -d > "$P12")
          security create-keychain -p "$KCPASS" "$KC"
          security set-keychain-settings -lut 3600 "$KC"
          security unlock-keychain -p "$KCPASS" "$KC"
          security import "$P12" -k "$KC" -P "$ASC_DIST_P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -k "$KCPASS" "$KC" > /dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          # Xcode 16 and later look in the first directory, older ones in the second.
          for d in "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles" \
                   "$HOME/Library/MobileDevice/Provisioning Profiles"; do
            mkdir -p "$d"
            for p in "$ASC_PROFILE_APP" "$ASC_PROFILE_WIDGET"; do
              printf '%s' "$p" | base64 -d > "$RUNNER_TEMP/p.mobileprovision"
              uuid=$(security cms -D -i "$RUNNER_TEMP/p.mobileprovision" | plutil -extract UUID raw -)
              cp "$RUNNER_TEMP/p.mobileprovision" "$d/$uuid.mobileprovision"
            done
          done
          xcodebuild archive -project Reci.xcodeproj -scheme Reci -configuration Release \
            -destination "generic/platform=iOS" -archivePath build/Reci.xcarchive \
            CURRENT_PROJECT_VERSION="$BUILD" CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- \
            AD_HOC_CODE_SIGNING_ALLOWED=YES PROVISIONING_PROFILE_SPECIFIER=
          xcodebuild -exportArchive -archivePath build/Reci.xcarchive -exportOptionsPlist ExportOptions.plist \
            -exportPath build/export
      # The widgets read the cards through the App Group: a signature without it would pass
      # the review and leave them empty.
      - name: The app and the widgets keep the App Group
        if: steps.key.outputs.ok
        working-directory: ios/build/export
        run: |
          unzip -q *.ipa
          for b in Payload/*.app Payload/*.app/PlugIns/*.appex; do
            codesign -d --entitlements - --xml "$b" | grep -q group.rs.finist.reci ||
              { echo "::error::$b is signed without the App Group"; exit 1; }
            codesign -dvv "$b" 2>&1 | grep '^Authority=' | head -1
          done
      - name: Upload
        if: steps.key.outputs.ok
        working-directory: ios/build/export
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          DIR="$HOME/.appstoreconnect/private_keys"
          trap 'rm -rf "$DIR"' EXIT
          (umask 077 && mkdir -p "$DIR" && printf '%s\n' "$ASC_KEY_P8" > "$DIR/AuthKey_$ASC_KEY_ID.p8")
          xcrun altool --upload-app --type ios -f *.ipa --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
