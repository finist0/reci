# The iPhone app needs a Mac to build; GitHub's macOS runners provide one with Xcode and the
# iOS simulator. The learning logic also runs on Linux, which is quicker and cheaper.
name: iOS

on:
  push:
    paths: ["ios/**", "tests/**", "app/app/src/main/assets/**", ".github/workflows/ios.yml"]
  pull_request:
    paths: ["ios/**", "tests/**", "app/app/src/main/assets/**", ".github/workflows/ios.yml"]
  workflow_dispatch:

jobs:
  core-linux:
    name: Learning logic on Linux
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container: swift:6.1
    steps:
      - uses: actions/checkout@v5
      - run: swift test
        working-directory: ios/ReciCore

  app-simulator:
    name: App and UI tests on ${{ matrix.device }}, iOS ${{ matrix.os }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    # GitHub may not offer the newest macOS image to every account yet.
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            device: iPhone 16
            slug: iphone-16
            os: "18.6"
            experimental: false
            main: true
          - runner: macos-15
            device: iPhone SE (3rd generation)
            slug: iphone-se
            os: "18.6"
            experimental: false
            main: false
          - runner: macos-26
            device: iPhone 17 Pro
            slug: iphone-17-pro
            os: latest
            experimental: true
            main: false
    steps:
      - uses: actions/checkout@v5
      - run: brew install xcodegen
      - run: xcodegen
        working-directory: ios
      - name: Learning logic on macOS
        if: matrix.main
        run: swift test
        working-directory: ios/ReciCore
      - name: Build an unsigned .ipa for a phone
        if: matrix.main
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild build -project Reci.xcodeproj -scheme Reci -configuration Release \
            -sdk iphoneos -destination "generic/platform=iOS" -derivedDataPath build/device \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
          mkdir -p build/ipa/Payload
          cp -R build/device/Build/Products/Release-iphoneos/Reci.app build/ipa/Payload/
          (cd build/ipa && zip -qry ../Reci-unsigned.ipa Payload)
      - name: Keep the .ipa
        if: matrix.main
        uses: actions/upload-artifact@v6
        with:
          name: reci-unsigned-ipa
          path: ios/build/Reci-unsigned.ipa
      # Some runners start without simulators: actions/runner-images#12948.
      - name: Create the simulator if the runner has none
        env:
          NAME: ${{ matrix.device }}
          OS: ${{ matrix.os }}
        run: |
          RUNTIME=$(xcrun simctl list runtimes available -j | jq -r --arg v "$OS" \
            '[.runtimes[] | select(.platform == "iOS" and ($v == "latest" or .version == $v))] | last | .identifier // empty')
          if [ -z "$RUNTIME" ]; then
            xcrun simctl list runtimes
            echo "No iOS $OS runtime on this runner"
            exit 1
          fi
          if xcrun simctl list devices available -j |
              jq -e --arg r "$RUNTIME" --arg n "$NAME" '.devices[$r] // [] | any(.name == $n)' > /dev/null; then
            exit 0
          fi
          TYPE=$(xcrun simctl list devicetypes -j | jq -r --arg n "$NAME" '.devicetypes[] | select(.name == $n) | .identifier')
          xcrun simctl create "$NAME" "$TYPE" "$RUNTIME"
      - name: Build the app with its widgets and run the UI tests
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild test -project Reci.xcodeproj -scheme Reci \
            -destination "platform=iOS Simulator,name=${{ matrix.device }},OS=${{ matrix.os }}" \
            -resultBundlePath build/Reci.xcresult \
            CODE_SIGNING_ALLOWED=NO
      # The screens ScreenshotUITests took, as PNG files named after the shots.
      - name: Export the screenshots
        if: always()
        continue-on-error: true
        working-directory: ios
        run: |
          [ -d build/Reci.xcresult ] || exit 0
          xcrun xcresulttool export attachments --path build/Reci.xcresult --output-path build/shots
          cd build/shots
          jq -r '.[].attachments[] | [.exportedFileName, .suggestedHumanReadableName] | @tsv' manifest.json |
            while IFS=$'\t' read -r file name; do mv "$file" "$(echo "$name" | sed -E 's/_[0-9]+_[0-9A-Fa-f-]+\.png$/.png/')"; done
      - name: Keep the screenshots
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ios-screenshots-${{ matrix.slug }}
          path: ios/build/shots/*.png
          if-no-files-found: ignore
      - name: Keep the test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ios-test-results-${{ matrix.slug }}
          path: ios/build/Reci.xcresult
          if-no-files-found: ignore
