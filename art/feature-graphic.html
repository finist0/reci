<!doctype html>
<!-- The Google Play feature graphic, 1024x500, one per store language: ?lang=ru, sr or en.
     Rendered to feature-graphic-<lang>.png by feature-graphic.mjs; open this page in a
     browser to see it. -->
<html lang="ru">
<head>
<meta charset="utf-8">
<style>
    @font-face { font-family: "Ruslan Display"; src: url("../app/app/src/main/res/font/ruslan_display.ttf"); }
    @font-face { font-family: "Literata"; src: url("../app/app/src/main/res/font/literata.ttf"); }
    html, body { margin: 0; }
    .banner {
        width: 1024px; height: 500px; box-sizing: border-box; padding: 0 72px;
        display: flex; align-items: center; gap: 56px;
        background: radial-gradient(circle at 18% 50%, #F7FAF1 0, #EEF2E6 55%, #DCE9CF 100%);
        font-family: system-ui, "Noto Sans", sans-serif; color: #263D1A; overflow: hidden;
    }
    .icon { width: 260px; height: 260px; border-radius: 58px; box-shadow: 0 10px 30px rgba(38, 61, 26, .25); flex: none; }
    .title { font: 64px/1 "Ruslan Display", serif; letter-spacing: 1px; }
    .title span { color: #B8322A; }
    .sub { margin-top: 18px; font-size: 27px; line-height: 1.3; color: #3F5A2E; }
    .word { margin-top: 30px; display: flex; align-items: baseline; gap: 16px; }
    .word b { font: 600 46px "Literata", serif; color: #263D1A; }
    .word i { font-style: normal; font-size: 24px; color: #6E6A64; }
    .chips { margin-top: 26px; display: flex; gap: 10px; }
    .chips span { padding: 8px 16px; border-radius: 999px; background: #4F7F34; color: #fff; font-size: 19px; font-weight: 600; white-space: nowrap; }
</style>
</head>
<body>
<div class="banner">
    <img class="icon" src="../web/icon.svg" alt="">
    <div>
        <div class="title"><span>НЕ</span>РОДНАЯ РЕЧЬ</div>
        <div class="sub"></div>
        <div class="word"><b></b><i></i></div>
        <div class="chips"></div>
    </div>
</div>
<script>
    const texts = {
        ru: { sub: "Сербские и русские слова<br>на экране блокировки", word: "ку́ћа", tr: "kuća — дом",
              chips: ["16 000 карточек", "ударения", "грамматика"] },
        sr: { sub: "Руске и српске речи<br>на закључаном екрану", word: "взгля́д", tr: "— поглед",
              chips: ["4.200 руских речи", "акценти", "лажни пријатељи"] },
        en: { sub: "Serbian and Russian words<br>on your lock screen", word: "ку́ћа", tr: "kuća — house",
              chips: ["16,000 Serbian cards", "4,200 Russian words", "stress marks"] },
    };
    const lang = new URLSearchParams(location.search).get("lang") || "ru";
    const t = texts[lang];
    document.documentElement.lang = lang;
    document.querySelector(".sub").innerHTML = t.sub;
    document.querySelector(".word b").textContent = t.word;
    document.querySelector(".word i").textContent = t.tr;
    document.querySelector(".chips").innerHTML = t.chips.map(c => `<span>${c}</span>`).join("");
    // Longer chips shrink to keep to one line inside the banner.
    const chips = document.querySelector(".chips");
    for (let size = 19; size > 14 && chips.getBoundingClientRect().right > 1024 - 56; size--)
        chips.querySelectorAll("span").forEach(c => (c.style.fontSize = `${size - 1}px`));
</script>
</body>
</html>
