<html lang="ru">
<head>
<meta charset="utf-8">
<style>
    @font-face { font-family: "Ruslan Display"; src: url("../app/app/src/main/res/font/ruslan_display.ttf"); }
    @font-face { font-family: "Literata"; src: url("../app/app/src/main/res/font/literata.ttf"); }
    html, body { margin: 0; }
    .banner {
        width: 1024px; height: 500px; box-sizing: border-box; padding: 0 72px;

    .title { font: 64px/1 "Ruslan Display", serif; letter-spacing: 1px; }
    .title span { color: #B8322A; }
    .sub { margin-top: 18px; font-size: 27px; line-height: 1.3; color: #3F5A2E; }
    .word { margin-top: 30px; display: flex; align-items: baseline; gap: 16px; }
    .word b { font: 600 46px "Literata", serif; color: #263D1A; }
    .word i { font-style: normal; font-size: 24px; color: #6E6A64; }
    .chips { margin-top: 26px; display: flex; gap: 10px; }
    .chips span { padding: 8px 16px; border-radius: 999px; background: #4F7F34; color: #fff; font-size: 19px; font-weight: 600; }
</style>
</head>
<body>
<div class="banner">
    <img class="icon" src="../web/icon.svg" alt="">
    <div>
        <div class="title"><span>НЕ</span>РОДНАЯ РЕЧЬ</div>
        <div class="sub">Сербские слова для тех,<br>кто говорит по&#8209;русски</div>
        <div class="word"><b>ку́ћа</b><i>kuća — дом</i></div>
        <div class="chips"><span>10 000 карточек</span><span>ударения</span><span>грамматика</span></div>
    </div>
</div>
</body>
</html>
